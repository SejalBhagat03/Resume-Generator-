name: Compile Resume PDF

on:
  push:
    paths:
      - 'resume.json'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout repository
      - name: Checkout Code
        uses: actions/checkout@v4

      # 2. Setup Python
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      # 3. Install dependencies
      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install reportlab pypdf

      # 4. Compile Resume
      - name: Compile Resume PDF
        run: |
          python generate_resume.py

      # 5. Commit and Push the compiled PDF
      - name: Commit and Push Compiled PDF
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add Sejal_Bhagat_Resume.pdf
          
          # Only commit and push if there are changes
          if ! git diff --cached --quiet; then
            git commit -m "chore(pdf): auto-compile latest resume PDF [skip ci]"
            git push
          else
            echo "No changes in compiled PDF."
          fi
